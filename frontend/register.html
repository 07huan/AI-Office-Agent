<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>注册 - AI 办公助手</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>创建账号</h1>

        <p class="subtitle">
            注册 AI 办公助手
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label>用户名</label>
                <input
                    id="username"
                    type="text"
                    placeholder="请输入用户名"
                    required
                >
            </div>

            <div class="form-group">
                <label>邮箱</label>
                <input
                    id="email"
                    type="email"
                    placeholder="请输入邮箱"
                    required
                >
            </div>

            <div class="form-group">
                <label>密码</label>
                <input
                    id="password"
                    type="password"
                    placeholder="请输入密码"
                    required
                >
            </div>

            <button
                class="primary-btn"
                type="submit"
            >
                注册
            </button>

        </form>

        <div
            id="errorMessage"
            class="error-message"
        ></div>

        <div class="switch-page">
            已经有账号？
            <a href="login.html">返回登录</a>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
