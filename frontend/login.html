<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>登录 - AI 办公助手</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>AI 办公助手</h1>

        <p class="subtitle">
            登录你的账号
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>用户名</label>
                <input
                    id="username"
                    type="text"
                    placeholder="请输入用户名"
                    required
                >
            </div>

            <div class="form-group">
                <label>密码</label>
                <input
                    id="password"
                    type="password"
                    placeholder="请输入密码"
                    required
                >
            </div>

            <button
                class="primary-btn"
                type="submit"
            >
                登录
            </button>

        </form>

        <div
            id="errorMessage"
            class="error-message"
        ></div>

        <div class="switch-page">
            还没有账号？
            <a href="register.html">立即注册</a>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
